spring.application.name=sita enterprises
# ===============================
# SERVER CONFIG
# ===============================
server.port=8080

# ===============================
# H2 DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:h2:mem:maasita
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=abhinav
spring.datasource.password=kumar

# ===============================
# H2 CONSOLE
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# LOGGING
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# SPRING SECURITY CUSTOM LOGIN
# ===============================

spring.security.user.name=admin
spring.security.user.password=Admin@123
spring.security.user.roles=ADMIN

